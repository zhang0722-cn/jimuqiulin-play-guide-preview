<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉木丘林 · 游玩攻略｜长图预览</title>
  <style>
    :root { color-scheme: light; --paper:#f2eee6; --ink:#27231d; --gold:#a87827; --line:rgba(39,35,29,.14); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    .progress { position:fixed; inset:0 auto auto 0; width:0; height:3px; background:var(--gold); z-index:20; transition:width .08s linear; }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px clamp(18px,4vw,48px); background:rgba(242,238,230,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(16px); }
    .brand { display:flex; align-items:baseline; gap:12px; min-width:0; }
    .brand strong { font-family:"Songti SC","STSong",serif; font-size:20px; font-weight:600; letter-spacing:.08em; white-space:nowrap; }
    .brand span { color:#756d60; font-size:12px; white-space:nowrap; }
    .actions { display:flex; gap:8px; }
    .actions a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; background:rgba(255,255,255,.48); }
    .actions a:hover { border-color:var(--gold); color:var(--gold); }
    main { padding:clamp(18px,4vw,48px) 14px 90px; }
    .stage { width:min(860px,100%); margin:0 auto; background:#fff; box-shadow:0 16px 60px rgba(55,42,23,.14); line-height:0; }
    .stage img { display:block; width:100%; height:auto; }
    .tip { margin:18px auto 0; color:#7b7265; font-size:12px; line-height:1.8; text-align:center; }
    .zoom { position:fixed; right:18px; bottom:18px; z-index:15; display:flex; align-items:center; gap:4px; padding:6px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.92); box-shadow:0 8px 28px rgba(55,42,23,.16); backdrop-filter:blur(12px); }
    .zoom button { width:34px; height:34px; border:0; border-radius:50%; background:transparent; color:var(--ink); font-size:18px; cursor:pointer; }
    .zoom button:hover { background:#eee7db; }
    .zoom output { min-width:52px; text-align:center; color:#5f574b; font:12px/1 ui-monospace,monospace; }
    @media(max-width:640px) { .brand span { display:none; } .actions a:first-child { display:none; } header { padding:12px 14px; } main { padding-left:8px; padding-right:8px; } .zoom { right:12px; bottom:12px; } }
    @media print { header,.zoom,.tip,.progress { display:none!important; } main { padding:0; } .stage { width:100%; box-shadow:none; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header>
    <div class="brand"><strong>吉木丘林 · 游玩攻略</strong><span>9 张连续长图 · 建议上下滑动阅读</span></div>
    <div class="actions">
      <a href="./assets/guide-long-web.jpg?v=20261113-114607" target="_blank" rel="noopener">查看长图</a>
      <a href="./assets/guide-long-web.jpg?v=20261113-114607" download>下载长图</a>
    </div>
  </header>
  <main>
    <div class="stage" id="stage"><img id="longImage" src="./assets/guide-long-web.jpg?v=20261113-114607" alt="吉木丘林游玩攻略连续长图"></div>
    <p class="tip">共 9 页，已按文件名顺序无缝拼接<br>1,080 × 31,845 px 网页版长图<br>更新于 2026-11-13 11:46</p>
  </main>
  <div class="zoom" aria-label="缩放控制">
    <button type="button" id="minus" aria-label="缩小">−</button>
    <output id="zoomValue">100%</output>
    <button type="button" id="plus" aria-label="放大">＋</button>
  </div>
  <script>
    const stage=document.getElementById('stage'),value=document.getElementById('zoomValue');let zoom=100;
    function renderZoom(){stage.style.width=`min(${860*zoom/100}px,${zoom}%)`;value.textContent=`${zoom}%`;}
    document.getElementById('minus').addEventListener('click',()=>{zoom=Math.max(50,zoom-10);renderZoom();});
    document.getElementById('plus').addEventListener('click',()=>{zoom=Math.min(160,zoom+10);renderZoom();});
    const progress=document.getElementById('progress');
    function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`;}
    addEventListener('scroll',updateProgress,{passive:true});addEventListener('resize',updateProgress);updateProgress();
  </script>
</body>
</html>
